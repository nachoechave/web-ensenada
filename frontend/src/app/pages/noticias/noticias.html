<app-navbar></app-navbar>

<main class="noticias-page page-shell">
  <section class="section-block">
    <div class="section-container">
      <div class="section-header centered">
        <span class="section-kicker">Actualidad municipal</span>
        <h1>Noticias de Ensenada</h1>
        <p>
          Conocé las últimas novedades, obras, actividades y programas impulsados por el Municipio.
        </p>
      </div>

      <div class="noticias-grid">
        @if (error) {
          <p role="alert">{{ error }}</p>
        }
        @for (noticia of noticias; track noticia.id) {
          <app-noticia-card [noticia]="noticia"></app-noticia-card>
        } @empty {
          @if (!error) {
            <p>No hay noticias publicadas.</p>
          }
        }
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
