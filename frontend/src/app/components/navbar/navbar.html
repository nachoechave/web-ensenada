<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="brand" aria-label="Ir al inicio" (click)="irAlInicio()">
      <div class="brand-icon">E</div>

      <div>
        <p>Municipalidad de</p>
        <strong>Ensenada</strong>
      </div>
    </a>

    <nav class="nav-links" aria-label="Navegación principal">
      @for (link of links; track link.texto) {
        <a
          [routerLink]="link.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exacta ?? false }"
        >
          {{ link.texto }}
        </a>
      }
    </nav>
  </div>
</header>
