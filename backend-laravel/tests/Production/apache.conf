ServerName www.ensenada.gov.ar
# Emulate cPanel's localized MIME handler using this image's actual PHP 8.3 SAPI.
Action application/x-httpd-ea-php83 /php83-local-handler
Alias /php83-local-handler /home/ensenada/handler.php
<Directory /home/ensenada>
    AllowOverride All
    Require all granted
</Directory>
<VirtualHost *:443>
    ServerName www.ensenada.gov.ar
    ServerAlias ensenada.gov.ar
    DocumentRoot /home/ensenada/public_html
    SSLEngine on
    SSLCertificateFile /tmp/cert.pem
    SSLCertificateKeyFile /tmp/key.pem
</VirtualHost>
<VirtualHost *:443>
    ServerName prueba.ensenada.gov.ar
    DocumentRoot /home/ensenada/public_html/prueba.ensenada.gov.ar
    SSLEngine on
    SSLCertificateFile /tmp/cert.pem
    SSLCertificateKeyFile /tmp/key.pem
</VirtualHost>
<VirtualHost *:443>
    ServerName tramites.ensenada.gov.ar
    DocumentRoot /home/ensenada/public_html/tramites.ensenada.gov.ar
    SSLEngine on
    SSLCertificateFile /tmp/cert.pem
    SSLCertificateKeyFile /tmp/key.pem
</VirtualHost>
<VirtualHost *:80>
    ServerName www.ensenada.gov.ar
    ServerAlias ensenada.gov.ar
    DocumentRoot /home/ensenada/public_html
</VirtualHost>
