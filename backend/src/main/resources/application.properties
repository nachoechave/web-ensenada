spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/web_ensenada}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
app.uploads.dir=${UPLOADS_DIR:uploads}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.login-rate-limit.attempts=${LOGIN_RATE_LIMIT_ATTEMPTS:10}
app.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
app.login-rate-limit.max-ips=${LOGIN_RATE_LIMIT_MAX_IPS:10000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Do not trust client-supplied forwarding headers for login IP accounting.
server.forward-headers-strategy=none
