<a class="noticia content-card" [routerLink]="['/noticias', noticia.slug]" [attr.aria-label]="'Leer noticia: ' + noticia.titulo">
  <div class="noticia-imagen"><img [src]="noticia.imagen" [alt]="noticia.titulo" loading="lazy" /></div>
  <div class="noticia-contenido">
    <span class="categoria">{{ noticia.categoria }}</span>
    <p class="fechaPublicacion">{{ noticia.fechaPublicacion | date:'dd/MM/yyyy' }}</p>
    <h2>{{ noticia.titulo }}</h2>
    <p class="bajada">{{ noticia.bajada }}</p>
    <span class="leer-noticia">Leer noticia <span aria-hidden="true">→</span></span>
  </div>
</a>
