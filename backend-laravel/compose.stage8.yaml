# Overlay for the disposable schema verification only.
services:
  mysql-auth:
    image: ${AUTH_STAGE8_MYSQL_IMAGE:-mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69}
    command: ["--skip-log-bin", "--character-set-server=utf8mb4", "--collation-server=${AUTH_STAGE8_COLLATION:-utf8mb4_0900_ai_ci}"]
    environment:
      AUTH_STAGE8_RUNTIME_PASSWORD: ${AUTH_STAGE8_RUNTIME_PASSWORD:?Set the existing synthetic runtime password}
      AUTH_STAGE8_COLLATION: ${AUTH_STAGE8_COLLATION:-utf8mb4_0900_ai_ci}
    volumes: !override
      - ./deploy/iwinds/schema-init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/mysql-stage8-accounts.sh:/docker-entrypoint-initdb.d/20-accounts.sh:ro
      - ./deploy/iwinds/schema-grants.sql:/stage8/grants.sql:ro
      - ../backend/src/main/resources/db/migration:/stage8/flyway:ro
  mysql-setup:
    environment:
      AUTH_STAGE8_SQL_FIXTURES: "true"
      DB_COLLATION: ${AUTH_STAGE8_COLLATION:-utf8mb4_0900_ai_ci}
  app:
    environment:
      AUTH_STAGE8_SQL_FIXTURES: "true"
      DB_COLLATION: ${AUTH_STAGE8_COLLATION:-utf8mb4_0900_ai_ci}
  tls:
    ports: !reset []
    volumes:
      - ./docker/stage8.Caddyfile:/etc/caddy/Caddyfile:ro
