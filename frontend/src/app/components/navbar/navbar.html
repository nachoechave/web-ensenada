<header class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="brand" aria-label="Ir al inicio" (click)="irArriba()">
      <span class="brand-logo" aria-hidden="true"></span>
    </a>

    <button type="button" class="menu-toggle" [class.open]="menuAbierto" [attr.aria-expanded]="menuAbierto" aria-controls="main-navigation" aria-label="Abrir o cerrar menú" (click)="alternarMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav id="main-navigation" class="nav-links" [class.open]="menuAbierto" aria-label="Navegación principal">
      @for (link of links; track link.texto) {
        @if (link.externo) {
          <a class="external-link" [href]="link.ruta" target="_blank" rel="noopener noreferrer">{{ link.texto }}</a>
        } @else if (link.fragmento) {
          <a [routerLink]="link.ruta" [fragment]="link.fragmento" (click)="irArriba()">{{ link.texto }}</a>
        } @else {
          <a [routerLink]="link.ruta" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: link.exacta ?? false }" (click)="irArriba()">{{ link.texto }}</a>
        }
      }
    </nav>
  </div>
</header>
