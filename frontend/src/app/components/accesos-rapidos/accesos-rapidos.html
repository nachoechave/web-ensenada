<section class="quick-access section-block" aria-label="Sistemas municipales">
  <div class="section-container">
    <h2>Accesos rápidos</h2>
    <div class="quick-grid">
      @for (acceso of accesos; track acceso.titulo) {
        <article class="quick-card content-card">
          <div>
            <h3>{{ acceso.titulo }}</h3>
            @if (acceso.url) {
              <a [href]="acceso.url" target="_blank" rel="noopener noreferrer"
                >Acceder al sistema</a
              >
            } @else {
              <p>Enlace pendiente de configuración.</p>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
