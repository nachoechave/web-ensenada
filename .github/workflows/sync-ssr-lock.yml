name: Sync SSR lockfile

on:
  push:
    branches:
      - feature/news-ssr
    paths:
      - 'frontend/package.json'
      - '.github/workflows/sync-ssr-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'chore: sync ssr lockfile')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/news-ssr
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          rm -f package-lock.json
          npm install --package-lock-only
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync ssr lockfile"
          git push origin HEAD:feature/news-ssr
