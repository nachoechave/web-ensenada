<section class="areas-section section-block">
  <div class="areas-container section-container">
    <div class="section-header">
      <span class="section-kicker">Gestión municipal</span>
      <h2>Áreas municipales</h2>
      <p>
        Conocé las principales áreas de trabajo del Municipio y los servicios que
        brindan a la comunidad.
      </p>
    </div>

    <div class="areas-grid">
      @for (area of areas; track area.id; let i = $index) {
        <article class="area-card content-card">
          <span class="area-number">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <h3>{{ area.nombre }}</h3>
          <p>{{ area.descripcion }}</p>
        </article>
      }
    </div>
  </div>
</section>
