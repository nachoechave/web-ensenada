spring.datasource.url=jdbc:h2:mem:web_ensenada;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.uploads.dir=uploads

app.jwt.secret=${JWT_SECRET:development-only-jwt-secret-change-before-production-1234567890}
app.jwt.expiration-minutes=120

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
